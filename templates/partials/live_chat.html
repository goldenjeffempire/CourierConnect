
<div x-data="{ 
    open: false, 
    messages: [], 
    inputMessage: '', 
    isConnected: false,
    socket: null,
    isTyping: false,
    init() {
        this.connectWebSocket();
    },
    connectWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/chat/`;
        
        try {
            this.socket = new WebSocket(wsUrl);
            
            this.socket.onopen = () => {
                this.isConnected = true;
                console.log('Chat WebSocket connected');
                this.addSystemMessage('Connected to support chat 👋');
            };
            
            this.socket.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.message) {
                    this.messages.push({
                        text: data.message,
                        isUser: false,
                        timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    });
                    this.$nextTick(() => {
                        const container = this.$refs.chatContainer;
                        if (container) container.scrollTop = container.scrollHeight;
                    });
                }
            };
            
            this.socket.onclose = () => {
                this.isConnected = false;
                this.addSystemMessage('Disconnected. Trying to reconnect...');
                setTimeout(() => this.connectWebSocket(), 3000);
            };
            
            this.socket.onerror = (error) => {
                console.error('WebSocket error:', error);
                this.isConnected = false;
            };
        } catch (error) {
            console.error('Failed to connect WebSocket:', error);
            this.isConnected = false;
        }
    },
    sendMessage() {
        if (!this.inputMessage.trim()) return;
        
        const userMessage = this.inputMessage.trim();
        this.messages.push({
            text: userMessage,
            isUser: true,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        
        if (this.socket && this.socket.readyState === WebSocket.OPEN) {
            this.socket.send(JSON.stringify({ message: userMessage }));
        }
        
        this.inputMessage = '';
        this.$nextTick(() => {
            const container = this.$refs.chatContainer;
            if (container) container.scrollTop = container.scrollHeight;
        });
    },
    addSystemMessage(text) {
        this.messages.push({
            text: text,
            isSystem: true,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
    }
}" class="fixed bottom-6 right-6 z-50">
    
    <!-- Chat Toggle Button -->
    <button 
        @click="open = !open" 
        class="group relative w-16 h-16 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-full shadow-2xl hover:shadow-blue-500/50 transition-all duration-300 hover:scale-110 flex items-center justify-center"
        :class="open ? 'scale-0' : 'scale-100'"
    >
        <svg class="w-8 h-8 text-white group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
        </svg>
        <div class="absolute -top-1 -right-1 w-5 h-5 bg-green-500 border-2 border-white rounded-full animate-pulse"></div>
        <div class="absolute inset-0 bg-blue-400 rounded-full opacity-0 group-hover:opacity-30 blur-xl transition-opacity"></div>
    </button>

    <!-- Chat Window -->
    <div 
        x-show="open" 
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 transform scale-75"
        x-transition:enter-end="opacity-100 transform scale-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 transform scale-100"
        x-transition:leave-end="opacity-0 transform scale-75"
        class="w-96 h-[600px] bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-gray-200"
    >
        <!-- Chat Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/>
                        </svg>
                    </div>
                    <div class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white" :class="isConnected ? 'bg-green-400' : 'bg-red-400'"></div>
                </div>
                <div>
                    <h3 class="text-white font-bold text-lg">AI Support</h3>
                    <p class="text-blue-100 text-xs" x-text="isConnected ? 'Online' : 'Connecting...'"></p>
                </div>
            </div>
            <button @click="open = false" class="text-white/80 hover:text-white transition-colors p-1 hover:bg-white/10 rounded-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Messages Container -->
        <div x-ref="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
            <template x-for="(msg, index) in messages" :key="index">
                <div :class="msg.isUser ? 'flex justify-end' : 'flex justify-start'">
                    <div 
                        class="max-w-[75%] rounded-2xl px-4 py-3 shadow-sm animate-slide-down"
                        :class="{
                            'bg-gradient-to-br from-blue-600 to-indigo-600 text-white': msg.isUser,
                            'bg-white text-gray-800': !msg.isUser && !msg.isSystem,
                            'bg-yellow-50 text-yellow-800 border border-yellow-200 text-center text-sm': msg.isSystem
                        }"
                    >
                        <p class="text-sm leading-relaxed" x-text="msg.text"></p>
                        <p class="text-xs mt-1 opacity-70" x-text="msg.timestamp"></p>
                    </div>
                </div>
            </template>
            
            <div x-show="messages.length === 0" class="text-center text-gray-400 mt-8">
                <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
                <p class="text-sm">Start a conversation!</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white border-t border-gray-200">
            <form @submit.prevent="sendMessage()" class="flex items-center space-x-2">
                <input
                    x-model="inputMessage"
                    type="text"
                    placeholder="Type your message..."
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                    :disabled="!isConnected"
                />
                <button
                    type="submit"
                    :disabled="!isConnected || !inputMessage.trim()"
                    class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-3 rounded-xl hover:shadow-lg transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed hover:scale-105"
                >
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                </button>
            </form>
            <p x-show="!isConnected" class="text-xs text-red-500 mt-2 flex items-center">
                <svg class="w-3 h-3 mr-1 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Reconnecting...
            </p>
        </div>
    </div>
</div>
