
<div id="chat-widget" class="fixed bottom-6 right-6 z-50" x-data="chatWidget()">
    <!-- Chat Toggle Button -->
    <button 
        @click="toggleChat()" 
        x-show="!isOpen"
        class="bg-blue-600 hover:bg-blue-700 text-white rounded-full p-4 shadow-lg transition-all duration-300 flex items-center gap-2"
    >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
        <span class="font-semibold">Live Support</span>
        <span x-show="unreadCount > 0" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center" x-text="unreadCount"></span>
    </button>

    <!-- Chat Window -->
    <div 
        x-show="isOpen" 
        x-transition
        class="bg-white rounded-lg shadow-2xl w-96 h-[600px] flex flex-col"
    >
        <!-- Chat Header -->
        <div class="bg-blue-600 text-white p-4 rounded-t-lg flex justify-between items-center">
            <div>
                <h3 class="font-semibold text-lg">Courier Core Support</h3>
                <p class="text-sm text-blue-100">
                    <span class="inline-block w-2 h-2 bg-green-400 rounded-full mr-1"></span>
                    Online
                </p>
            </div>
            <button @click="toggleChat()" class="text-white hover:text-blue-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Chat Messages -->
        <div 
            id="chat-messages" 
            class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50"
            x-ref="messageContainer"
        >
            <template x-for="msg in messages" :key="msg.id">
                <div 
                    :class="msg.sender === 'user' ? 'flex justify-end' : 'flex justify-start'"
                >
                    <div 
                        :class="msg.sender === 'user' ? 'bg-blue-600 text-white' : 'bg-white text-gray-800'"
                        class="max-w-xs px-4 py-2 rounded-lg shadow"
                    >
                        <p class="text-sm" x-text="msg.message"></p>
                        <p class="text-xs mt-1 opacity-75" x-text="formatTime(msg.timestamp)"></p>
                    </div>
                </div>
            </template>

            <!-- Typing Indicator -->
            <div x-show="isTyping" class="flex justify-start">
                <div class="bg-white text-gray-800 px-4 py-2 rounded-lg shadow">
                    <div class="flex gap-1">
                        <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Input -->
        <div class="p-4 border-t bg-white rounded-b-lg">
            <form @submit.prevent="sendMessage()" class="flex gap-2">
                <input 
                    x-model="messageInput"
                    type="text" 
                    placeholder="Type your message..."
                    class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    :disabled="!isConnected"
                >
                <button 
                    type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed"
                    :disabled="!messageInput.trim() || !isConnected"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                    </svg>
                </button>
            </form>
            <p x-show="!isConnected" class="text-xs text-red-500 mt-2">Connecting...</p>
        </div>
    </div>
</div>

<script>
function chatWidget() {
    return {
        isOpen: false,
        isConnected: false,
        isTyping: false,
        messageInput: '',
        messages: [],
        unreadCount: 0,
        ws: null,

        init() {
            this.connectWebSocket();
        },

        connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/chat/`;
            
            this.ws = new WebSocket(wsUrl);
            
            this.ws.onopen = () => {
                this.isConnected = true;
                console.log('Chat WebSocket connected');
            };
            
            this.ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'chat_message') {
                    this.messages.push({
                        id: Date.now(),
                        message: data.message,
                        sender: data.sender,
                        timestamp: data.timestamp
                    });
                    
                    if (!this.isOpen && data.sender === 'bot') {
                        this.unreadCount++;
                    }
                    
                    this.$nextTick(() => {
                        this.scrollToBottom();
                    });
                }
            };
            
            this.ws.onerror = (error) => {
                console.error('Chat WebSocket error:', error);
                this.isConnected = false;
            };
            
            this.ws.onclose = () => {
                this.isConnected = false;
                console.log('Chat WebSocket disconnected');
                
                // Attempt to reconnect after 3 seconds
                setTimeout(() => {
                    if (!this.isConnected) {
                        this.connectWebSocket();
                    }
                }, 3000);
            };
        },

        toggleChat() {
            this.isOpen = !this.isOpen;
            if (this.isOpen) {
                this.unreadCount = 0;
                this.$nextTick(() => {
                    this.scrollToBottom();
                });
            }
        },

        sendMessage() {
            if (!this.messageInput.trim() || !this.isConnected) return;
            
            this.ws.send(JSON.stringify({
                message: this.messageInput
            }));
            
            this.messageInput = '';
            this.isTyping = true;
            
            setTimeout(() => {
                this.isTyping = false;
            }, 1500);
        },

        scrollToBottom() {
            const container = this.$refs.messageContainer;
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        },

        formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }
    }
}
</script>
