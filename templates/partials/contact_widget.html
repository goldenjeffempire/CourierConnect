<div id="contact-widget" class="fixed bottom-6 right-6 z-50">
    <div id="chat-button" class="bg-blue-600 hover:bg-blue-700 text-white rounded-full w-16 h-16 flex items-center justify-center shadow-lg cursor-pointer transition transform hover:scale-110" onclick="toggleChat()">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
        </svg>
    </div>
    
    <div id="chat-window" class="hidden bg-white rounded-lg shadow-2xl w-96 h-[500px] flex flex-col">
        <div class="bg-gradient-to-r from-blue-600 to-blue-800 text-white px-6 py-4 rounded-t-lg flex justify-between items-center">
            <div>
                <h3 class="font-bold text-lg">Customer Support</h3>
                <p class="text-sm text-blue-100">We typically reply in minutes</p>
            </div>
            <button onclick="toggleChat()" class="text-white hover:text-gray-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto bg-gray-50 space-y-4">
            <div class="flex items-start space-x-2">
                <div class="bg-blue-100 rounded-full w-8 h-8 flex items-center justify-center flex-shrink-0">
                    <span class="text-blue-600 font-bold text-sm">CS</span>
                </div>
                <div class="bg-white rounded-lg p-3 shadow-sm max-w-xs">
                    <p class="text-sm text-gray-800">Hello! How can I help you today?</p>
                    <p class="text-xs text-gray-500 mt-1">Now</p>
                </div>
            </div>
        </div>
        
        <div class="p-4 border-t bg-white rounded-b-lg">
            <form id="chat-form" class="flex space-x-2" onsubmit="sendMessage(event)">
                <input type="text" id="chat-input" placeholder="Type your message..." 
                       class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-semibold">
                    Send
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function toggleChat() {
    const chatWindow = document.getElementById('chat-window');
    const chatButton = document.getElementById('chat-button');
    
    if (chatWindow.classList.contains('hidden')) {
        chatWindow.classList.remove('hidden');
        chatButton.classList.add('hidden');
    } else {
        chatWindow.classList.add('hidden');
        chatButton.classList.remove('hidden');
    }
}

function sendMessage(event) {
    event.preventDefault();
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    
    if (!message) return;
    
    const messagesContainer = document.getElementById('chat-messages');
    
    const userMessage = document.createElement('div');
    userMessage.className = 'flex items-start space-x-2 justify-end';
    userMessage.innerHTML = `
        <div class="bg-blue-600 text-white rounded-lg p-3 shadow-sm max-w-xs">
            <p class="text-sm">${message}</p>
            <p class="text-xs text-blue-100 mt-1">Now</p>
        </div>
    `;
    messagesContainer.appendChild(userMessage);
    
    input.value = '';
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
    
    setTimeout(() => {
        const responses = [
            "Thank you for contacting us! A support agent will respond shortly.",
            "I understand your concern. Let me check that for you.",
            "Our team is reviewing your request. We'll get back to you within 24 hours.",
            "For immediate assistance, please call our hotline at +1 (555) 123-4567.",
            "Thank you for your patience. Your parcel details are being updated."
        ];
        
        const botMessage = document.createElement('div');
        botMessage.className = 'flex items-start space-x-2';
        botMessage.innerHTML = `
            <div class="bg-blue-100 rounded-full w-8 h-8 flex items-center justify-center flex-shrink-0">
                <span class="text-blue-600 font-bold text-sm">CS</span>
            </div>
            <div class="bg-white rounded-lg p-3 shadow-sm max-w-xs">
                <p class="text-sm text-gray-800">${responses[Math.floor(Math.random() * responses.length)]}</p>
                <p class="text-xs text-gray-500 mt-1">Now</p>
            </div>
        `;
        messagesContainer.appendChild(botMessage);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }, 1000);
}
</script>
