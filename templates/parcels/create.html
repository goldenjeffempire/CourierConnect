{% extends 'base.html' %}

{% block title %}Create Shipment - Courier Core{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-indigo-50 py-12">
<div class="max-w-4xl mx-auto">
    <div class="bg-white rounded-lg shadow-xl p-8">
        <h2 class="text-3xl font-bold text-gray-900 mb-8">Create Shipment</h2>
        
        <form method="post" class="space-y-6" x-data="{ serviceType: 'standard' }">
            {% csrf_token %}
            
            <div class="grid md:grid-cols-2 gap-6">
                <div class="space-y-4">
                    <h3 class="text-xl font-semibold text-gray-800">Pickup Details</h3>
                    
                    <div>
                        <label for="pickup_address" class="block text-sm font-medium text-gray-700 mb-2">Pickup Address</label>
                        <textarea id="pickup_address" name="pickup_address" rows="3" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="pickup_lat" class="block text-sm font-medium text-gray-700 mb-2">Latitude</label>
                            <input type="number" step="0.000001" id="pickup_lat" name="pickup_lat" value="40.7128" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label for="pickup_lng" class="block text-sm font-medium text-gray-700 mb-2">Longitude</label>
                            <input type="number" step="0.000001" id="pickup_lng" name="pickup_lng" value="-74.0060" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>
                
                <div class="space-y-4">
                    <h3 class="text-xl font-semibold text-gray-800">Delivery Details</h3>
                    
                    <div>
                        <label for="dropoff_address" class="block text-sm font-medium text-gray-700 mb-2">Delivery Address</label>
                        <textarea id="dropoff_address" name="dropoff_address" rows="3" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="dropoff_lat" class="block text-sm font-medium text-gray-700 mb-2">Latitude</label>
                            <input type="number" step="0.000001" id="dropoff_lat" name="dropoff_lat" value="34.0522" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label for="dropoff_lng" class="block text-sm font-medium text-gray-700 mb-2">Longitude</label>
                            <input type="number" step="0.000001" id="dropoff_lng" name="dropoff_lng" value="-118.2437" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>
            </div>
            
            <div>
                <label for="package_description" class="block text-sm font-medium text-gray-700 mb-2">Package Description</label>
                <input type="text" id="package_description" name="package_description" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div class="grid md:grid-cols-4 gap-4">
                <div>
                    <label for="weight" class="block text-sm font-medium text-gray-700 mb-2">Weight (lbs)</label>
                    <input type="number" step="0.1" id="weight" name="weight" value="5" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="length" class="block text-sm font-medium text-gray-700 mb-2">Length (in)</label>
                    <input type="number" step="0.1" id="length" name="length" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="width" class="block text-sm font-medium text-gray-700 mb-2">Width (in)</label>
                    <input type="number" step="0.1" id="width" name="width" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="height" class="block text-sm font-medium text-gray-700 mb-2">Height (in)</label>
                    <input type="number" step="0.1" id="height" name="height" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Service Type</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="relative flex cursor-pointer rounded-lg border p-4 focus:outline-none" :class="serviceType === 'standard' ? 'border-blue-600 bg-blue-50' : 'border-gray-300'">
                        <input type="radio" name="service_type" value="standard" class="sr-only" x-model="serviceType">
                        <div class="flex flex-1">
                            <div class="flex flex-col">
                                <span class="block text-sm font-medium text-gray-900">Standard</span>
                                <span class="mt-1 flex items-center text-sm text-gray-500">3-5 business days</span>
                            </div>
                        </div>
                    </label>
                    <label class="relative flex cursor-pointer rounded-lg border p-4 focus:outline-none" :class="serviceType === 'express' ? 'border-blue-600 bg-blue-50' : 'border-gray-300'">
                        <input type="radio" name="service_type" value="express" class="sr-only" x-model="serviceType">
                        <div class="flex flex-1">
                            <div class="flex flex-col">
                                <span class="block text-sm font-medium text-gray-900">Express</span>
                                <span class="mt-1 flex items-center text-sm text-gray-500">1-2 business days (+50%)</span>
                            </div>
                        </div>
                    </label>
                </div>
            </div>
            
            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-lg font-semibold text-lg hover:bg-blue-700 transition">
                Calculate Price & Continue to Payment
            </button>
        </form>
    </div>
</div>
{% endblock %}
