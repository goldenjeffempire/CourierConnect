{% extends 'base.html' %}

{% block title %}Get Quote - Courier Core{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-lg shadow-xl p-8">
        <h2 class="text-3xl font-bold text-gray-900 mb-6">Get Instant Quote</h2>
        
        <div x-data="{ weight: 5, distance: 100, serviceType: 'standard', quote: null }">
            <div class="space-y-6 mb-8">
                <div>
                    <label for="weight" class="block text-sm font-medium text-gray-700 mb-2">Weight (lbs)</label>
                    <input type="number" x-model="weight" min="0.1" step="0.1" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label for="distance" class="block text-sm font-medium text-gray-700 mb-2">Distance (miles)</label>
                    <input type="number" x-model="distance" min="1" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Service Type</label>
                    <select x-model="serviceType" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="standard">Standard (3-5 days)</option>
                        <option value="express">Express (1-2 days)</option>
                    </select>
                </div>
                
                <button @click="calculateQuote()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                    Calculate Quote
                </button>
            </div>
            
            <div x-show="quote" class="bg-blue-50 border border-blue-200 rounded-lg p-6 text-center">
                <p class="text-gray-600 mb-2">Estimated Price</p>
                <p class="text-4xl font-bold text-gray-900 mb-2" x-text="quote ? '$' + quote : ''"></p>
                <p class="text-sm text-gray-600" x-text="serviceType === 'express' ? '1-2 business days' : '3-5 business days'"></p>
            </div>
        </div>
        
        <script>
            function calculateQuote() {
                const weight = parseFloat(document.querySelector('[x-model=weight]').value);
                const distance = parseFloat(document.querySelector('[x-model=distance]').value);
                const serviceType = document.querySelector('[x-model=serviceType]').value;
                
                let price = 5.00 + (weight * 0.50) + (distance * 0.10);
                if (serviceType === 'express') {
                    price = price * 1.5;
                }
                
                const quoteElement = document.querySelector('[x-text*="quote"]');
                quoteElement.textContent = '$' + price.toFixed(2);
                document.querySelector('[x-show=quote]').style.display = 'block';
            }
        </script>
    </div>
</div>
{% endblock %}
