
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #2563eb; color: white; padding: 20px; text-align: center; }
        .content { background-color: #f9fafb; padding: 30px; }
        .status-update { background-color: white; border-left: 4px solid #2563eb; padding: 20px; margin: 20px 0; }
        .footer { background-color: #1f2937; color: #9ca3af; padding: 20px; text-align: center; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Shipment Status Update</h1>
        </div>
        
        <div class="content">
            <p>Hi there,</p>
            
            <p>Your shipment <strong>{{ parcel.tracking_number }}</strong> has been updated:</p>
            
            <div class="status-update">
                <h3>{{ status|title }}</h3>
                <p>{{ description }}</p>
            </div>
            
            <p style="text-align: center; margin-top: 30px;">
                <a href="{{ tracking_url }}" style="display: inline-block; background-color: #2563eb; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px;">View Full Tracking</a>
            </p>
        </div>
        
        <div class="footer">
            <p>&copy; 2024 Courier Core. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
